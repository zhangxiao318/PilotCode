[package]
name = "pilotcode-remote-agent"
version = "0.1.0"
edition = "2021"
authors = ["PilotCode Contributors"]
description = "Minimal remote agent for PilotCode embedded development"
license = "MIT"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
# musl target will statically link libc
